[workspace]
resolver = "3"
members = ["crates/musicus-api", "crates/musicus-server", "crates/musicus-web"]
# The web client only builds for wasm32 (via `dx`), so plain `cargo build`
# and `cargo test` cover the shared types and the server.
default-members = ["crates/musicus-api", "crates/musicus-server"]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
musicus-api = { path = "crates/musicus-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
debug = false
panic = "abort"
