[package]
name = "musicus-web"
description = "Musicus web client (Dioxus, WebAssembly)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
musicus-api.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "DomRect", "Navigator", "Location", "File", "Blob", "CssStyleDeclaration", "PointerEvent", "MouseEvent", "Event", "EventTarget"] }
